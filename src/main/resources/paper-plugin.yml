name: 'CrazyCrates'
main: 'com.badbones69.crazycrates.CrazyCrates'

version: '4.0.6'
api-version: '1.21'
description: 'Create unlimited crates with multiple crate types to choose from!'
website: 'https://modrinth.com/plugin/crazycrates'

folia-supported: true

dependencies:
  server:
    DecentHolograms:
     load: BEFORE
     required: false
     join-classpath: true
    FancyHolograms:
      load: BEFORE
      required: false
      join-classpath: true
    CMI:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
     load: BEFORE
     required: false
     join-classpath: true
    Oraxen:
     load: BEFORE
     required: false
     join-classpath: true
    HeadDatabase:
      load: BEFORE
      required: false
      join-classpath: true
    MMOItems:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    TurtleTop:
      load: BEFORE
      required: false
      join-classpath: true

    # Other crate plugins to migrate for people
    ExcellentCrates:
      load: BEFORE
      required: false
      join-classpath: true
